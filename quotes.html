<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Quotes | Philosophy & Literature</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      background: #f6f1e7;
      color: #302d28;
    }

    header {
      background: #292721;
      color: #f6f1e7;
      padding: 22px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    header p {
      margin: 0;
      color: #d8d0c2;
    }

    nav {
      background: #403a33;
      padding: 12px;
      text-align: center;
    }

    nav a {
      color: #f6f1e7;
      text-decoration: none;
      margin: 0 10px;
      font-size: 14px;
    }

    .container {
      max-width: 850px;
      margin: auto;
      padding: 45px 20px;
    }

    .intro {
      text-align: center;
      margin-bottom: 35px;
    }

    .intro h2 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .intro p {
      color: #6d675f;
    }

    .quote-card {
      background: #fffdf8;
      padding: 30px;
      margin-bottom: 22px;
      border-radius: 4px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      border-left: 3px solid #9b8b70;
    }

    blockquote {
      margin: 0 0 18px;
      font-size: 23px;
      line-height: 1.65;
      font-style: italic;
    }

    .author {
      font-size: 16px;
      font-weight: bold;
    }

    .source {
      margin-top: 5px;
      color: #756e65;
      font-size: 14px;
    }

    .empty {
      text-align: center;
      padding: 40px;
      color: #756e65;
    }

    footer {
      background: #292721;
      color: #d8d0c2;
      text-align: center;
      padding: 28px 20px;
      margin-top: 30px;
      font-size: 14px;
    }

    footer a {
      color: #d8d0c2;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 25px;
      }

      .container {
        padding: 32px 15px;
      }

      .quote-card {
        padding: 22px;
      }

      blockquote {
        font-size: 20px;
      }

      nav a {
        margin: 0 5px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Philosophy & Literature</h1>
  <p>A growing digital archive of ideas and words</p>
</header>

<nav>
  <a href="index.html">Home</a>
  <a href="index.html#philosophy">Philosophy</a>
  <a href="index.html#literature">Literature</a>
  <a href="index.html#library">Library</a>
  <a href="quotes.html">Quotes</a>
  <a href="index.html#articles">Articles</a>
  <a href="index.html#gallery">Gallery</a>
  <a href="index.html#about">About</a>
</nav>

<main class="container">

  <section class="intro">
    <h2>Quotes</h2>
    <p>
      Philosophical and literary quotations from the growing archive.
    </p>
  </section>

  <div id="quotesContainer">
    <div class="empty">Loading quotes...</div>
  </div>

</main>

<footer>
  <p>© Philosophy & Literature</p>
  <p>Built as an educational digital archive.</p>
</footer>

<script>

  const SUPABASE_URL = "https://vsrhycbtqwtlrqcdyqdj.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_K0Ha-NPagsXFw-HwHG5HbQ_d27vXgMJ";

  const { createClient } = supabase;

  const client = createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


  async function loadQuotes() {

    const container =
      document.getElementById("quotesContainer");

    const { data, error } = await client
      .from("quotes")
      .select(`
        quote_text,
        source,
        authors(name)
      `)
      .eq("is_published", true)
      .order("created_at", { ascending: false });


    if (error) {

      container.innerHTML =
        '<div class="empty">Unable to load quotes.</div>';

      return;
    }


    if (!data || data.length === 0) {

      container.innerHTML =
        '<div class="empty">No published quotes yet.</div>';

      return;
    }


    container.innerHTML = data.map(quote => {

      const author =
        quote.authors?.name || "Unknown author";

      const source =
        quote.source
          ? `<div class="source">${escapeHtml(quote.source)}</div>`
          : "";

      return `
        <article class="quote-card">

          <blockquote>
            “${escapeHtml(quote.quote_text)}”
          </blockquote>

          <div class="author">
            — ${escapeHtml(author)}
          </div>

          ${source}

        </article>
      `;

    }).join("");
  }


  function escapeHtml(text) {

    const div = document.createElement("div");

    div.textContent = text || "";

    return div.innerHTML;
  }


  loadQuotes();

</script>

</body>
</html>
