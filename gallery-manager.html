<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gallery Manager | Philosophy & Literature</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  color: #222;
}

header {
  background: #111827;
  color: white;
  padding: 18px;
}

header h1 {
  margin: 0 0 5px;
  font-size: 22px;
}

header p {
  margin: 0;
  color: #d1d5db;
  font-size: 14px;
}

.container {
  max-width: 1000px;
  margin: auto;
  padding: 16px;
}

.topbar {
  display: flex;
  gap: 8px;
  margin-bottom: 15px;
}

button {
  border: 0;
  border-radius: 7px;
  padding: 10px 14px;
  cursor: pointer;
  font-size: 14px;
}

.back {
  background: #374151;
  color: white;
}

.logout {
  background: #b91c1c;
  color: white;
}

.card {
  background: white;
  padding: 18px;
  border-radius: 12px;
  margin-bottom: 18px;
  box-shadow: 0 2px 8px #00000012;
}

h2 {
  margin-top: 0;
  font-size: 20px;
}

label {
  display: block;
  margin: 13px 0 6px;
  font-weight: bold;
  font-size: 14px;
}

input,
textarea,
select {
  width: 100%;
  padding: 11px;
  border: 1px solid #d1d5db;
  border-radius: 7px;
  font-size: 15px;
  background: white;
}

textarea {
  min-height: 100px;
  resize: vertical;
}

.file-input {
  padding: 9px;
}

.preview {
  margin-top: 12px;
}

.preview img {
  width: 100%;
  max-height: 300px;
  object-fit: contain;
  border-radius: 8px;
  background: #f3f4f6;
}

.current-image {
  margin-top: 10px;
}

.current-image img {
  width: 100%;
  max-height: 250px;
  object-fit: contain;
  border-radius: 8px;
  background: #f3f4f6;
}

.message {
  display: none;
  padding: 12px;
  border-radius: 8px;
  margin-bottom: 15px;
}

.success {
  display: block;
  background: #dcfce7;
  color: #166534;
}

.error {
  display: block;
  background: #fee2e2;
  color: #991b1b;
}

.save {
  margin-top: 16px;
  background: #111827;
  color: white;
}

.save:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.cancel {
  margin-top: 16px;
  background: #e5e7eb;
  display: none;
}

.gallery-item {
  border: 1px solid #e5e7eb;
  border-radius: 10px;
  padding: 14px;
  margin-bottom: 12px;
}

.gallery-item img {
  width: 100%;
  max-height: 280px;
  object-fit: cover;
  border-radius: 8px;
  margin-bottom: 12px;
}

.gallery-title {
  font-family: Georgia, serif;
  font-size: 21px;
  margin-bottom: 7px;
}

.gallery-description {
  color: #555;
  line-height: 1.5;
  margin-bottom: 8px;
}

.meta {
  color: #6b7280;
  font-size: 13px;
  margin-bottom: 10px;
}

.actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.edit {
  background: #2563eb;
  color: white;
}

.publish {
  background: #059669;
  color: white;
}

.unpublish {
  background: #d97706;
  color: white;
}

.delete {
  background: #dc2626;
  color: white;
}

.status {
  display: inline-block;
  padding: 4px 8px;
  border-radius: 20px;
  font-size: 12px;
  margin-bottom: 8px;
}

.published {
  background: #dcfce7;
  color: #166534;
}

.draft {
  background: #fee2e2;
  color: #991b1b;
}

.loading {
  color: #6b7280;
  padding: 10px 0;
}

.help {
  color: #6b7280;
  font-size: 13px;
  line-height: 1.4;
  margin-top: 6px;
}

@media(max-width:600px) {
  .topbar {
    flex-direction: column;
  }

  button {
    width: 100%;
  }

  .card {
    padding: 14px;
  }
}
</style>
</head>

<body>

<header>
  <h1>Manage Gallery</h1>
  <p>Philosophy & Literature — Editor Panel</p>
</header>

<div class="container">

  <div class="topbar">
    <button class="back" id="backButton">← Dashboard</button>
    <button class="logout" id="logoutButton">Logout</button>
  </div>

  <div id="message" class="message"></div>

  <div class="card">

    <h2 id="formTitle">Add Gallery Item</h2>

    <label for="title">Title *</label>
    <input
      id="title"
      type="text"
      placeholder="Enter artwork title"
    >

    <label for="description">Description</label>
    <textarea
      id="description"
      placeholder="Describe the artwork or visual..."
    ></textarea>

    <label for="imageFile">Image *</label>

    <input
      id="imageFile"
      class="file-input"
      type="file"
      accept="image/*"
    >

    <div class="help">
      Choose an image directly from your phone.
    </div>

    <div id="imagePreview" class="preview"></div>

    <label for="category">Category</label>

    <select id="category">
      <option value="">Select category</option>
    </select>

    <label>
      <input
        type="checkbox"
        id="published"
        style="width:auto"
      >
      Publish this gallery item
    </label>

    <button class="save" id="saveButton">
      Save Gallery Item
    </button>

    <button class="cancel" id="cancelButton">
      Cancel Edit
    </button>

  </div>

  <div class="card">

    <h2>Gallery Items</h2>

    <input
      id="search"
      type="text"
      placeholder="Search gallery..."
    >

    <div id="galleryList">
      <div class="loading">
        Loading gallery...
      </div>
    </div>

  </div>

</div>

<script>

const SUPABASE_URL =
  "https://vsrhycbtqwtlrqcdyqdj.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_K0Ha-NPagsXFw-HwHG5HbQ_d27vXgMJ";

const client =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

const BUCKET_NAME = "gallery";

let galleryItems = [];
let categories = [];
let editingId = null;
let currentImageUrl = null;

function showMessage(text, error = false) {

  const box =
    document.getElementById("message");

  box.textContent = text;

  box.className =
    "message " + (error ? "error" : "success");
}

function escapeHtml(value) {

  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

async function start() {

  try {

    const {
      data,
      error
    } = await client.auth.getSession();

    if (error) {
      throw error;
    }

    if (!data.session) {

      location.href = "admin.html";
      return;
    }

    await loadCategories();
    await loadGallery();

  } catch (error) {

    console.error(error);

    showMessage(
      "Could not start Gallery Manager: " +
      error.message,
      true
    );
  }
}

async function loadCategories() {

  const select =
    document.getElementById("category");

  select.innerHTML =
    "<option value=''>Loading categories...</option>";

  const {
    data,
    error
  } = await client
    .from("categories")
    .select("id,name")
    .order("name");

  if (error) {

    select.innerHTML =
      "<option value=''>Category error</option>";

    throw error;
  }

  categories = data || [];

  select.innerHTML =
    "<option value=''>Select category</option>";

  categories.forEach(category => {

    const option =
      document.createElement("option");

    option.value = category.id;
    option.textContent = category.name;

    select.appendChild(option);
  });
}

async function loadGallery() {

  const list =
    document.getElementById("galleryList");

  list.innerHTML =
    "<div class='loading'>Loading gallery...</div>";

  const {
    data,
    error
  } = await client
    .from("gallery")
    .select("*")
    .order("created_at", {
      ascending: false
    });

  if (error) {
    throw error;
  }

  galleryItems = data || [];

  renderGallery();
}

function renderGallery() {

  const list =
    document.getElementById("galleryList");

  const query =
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();

  const categoryMap = {};

  categories.forEach(category => {
    categoryMap[category.id] =
      category.name;
  });

  const filtered =
    galleryItems.filter(item => {

      return (
        String(item.title || "")
          .toLowerCase()
          .includes(query) ||

        String(item.description || "")
          .toLowerCase()
          .includes(query)
      );
    });

  if (!filtered.length) {

    list.innerHTML =
      "<p>No gallery items found.</p>";

    return;
  }

  list.innerHTML =
    filtered.map(item => {

      const status =
        item.is_published
          ? "Published"
          : "Draft";

      const category =
        categoryMap[item.category_id] ||
        "No category";

      return `
        <div class="gallery-item">

          <span class="status ${
            item.is_published
              ? "published"
              : "draft"
          }">
            ${status}
          </span>

          ${
            item.image_url
              ? `
                <img
                  src="${escapeHtml(item.image_url)}"
                  alt="${escapeHtml(item.title)}"
                  onerror="this.style.display='none'"
                >
              `
              : ""
          }

          <div class="gallery-title">
            ${escapeHtml(item.title)}
          </div>

          <div class="gallery-description">
            ${escapeHtml(item.description)}
          </div>

          <div class="meta">
            ${escapeHtml(category)}
          </div>

          <div class="actions">

            <button
              class="edit"
              onclick="editItem('${item.id}')">
              Edit
            </button>

            <button
              class="${
                item.is_published
                  ? "unpublish"
                  : "publish"
              }"
              onclick="togglePublish('${item.id}')">
              ${
                item.is_published
                  ? "Unpublish"
                  : "Publish"
              }
            </button>

            <button
              class="delete"
              onclick="deleteItem('${item.id}')">
              Delete
            </button>

          </div>

        </div>
      `;

    }).join("");
}

async function uploadImage(file) {

  if (!file) {
    return null;
  }

  const {
    data: sessionData,
    error: sessionError
  } = await client.auth.getSession();

  if (sessionError) {
    throw sessionError;
  }

  if (!sessionData.session) {
    throw new Error("You are not logged in.");
  }

  const userId =
    sessionData.session.user.id;

  const extension =
    file.name.includes(".")
      ? file.name.split(".").pop().toLowerCase()
      : "jpg";

  const safeExtension =
    extension.replace(/[^a-z0-9]/g, "");

  const fileName =
    `${Date.now()}-${Math.random()
      .toString(36)
      .substring(2, 8)}.${safeExtension}`;

  const filePath =
    `${userId}/${fileName}`;

  const {
    error
  } = await client.storage
    .from(BUCKET_NAME)
    .upload(filePath, file, {
      cacheControl: "3600",
      upsert: false
    });

  if (error) {
    throw error;
  }

  const {
    data
  } = client.storage
    .from(BUCKET_NAME)
    .getPublicUrl(filePath);

  return data.publicUrl;
}

async function saveItem() {

  const title =
    document.getElementById("title")
      .value.trim();

  const description =
    document.getElementById("description")
      .value.trim();

  const imageFile =
    document.getElementById("imageFile")
      .files[0];

  const categoryId =
    document.getElementById("category")
      .value || null;

  const published =
    document.getElementById("published")
      .checked;

  if (!title) {

    showMessage(
      "Please enter a title.",
      true
    );

    return;
  }

  if (!editingId && !imageFile) {

    showMessage(
      "Please choose an image.",
      true
    );

    return;
  }

  const saveButton =
    document.getElementById("saveButton");

  saveButton.disabled = true;
  saveButton.textContent = "Uploading...";

  try {

    let imageUrl =
      currentImageUrl;

    if (imageFile) {

      imageUrl =
        await uploadImage(imageFile);
    }

    if (!imageUrl) {
      throw new Error("Image upload failed.");
    }

    const payload = {

      title: title,

      description: description,

      image_url: imageUrl,

      category_id: categoryId,

      is_published: published
    };

    let result;

    if (editingId) {

      result =
        await client
          .from("gallery")
          .update(payload)
          .eq("id", editingId);

    } else {

      result =
        await client
          .from("gallery")
          .insert(payload);
    }

    if (result.error) {
      throw result.error;
    }

    showMessage(
      editingId
        ? "Gallery item updated successfully."
        : "Gallery item saved successfully."
    );

    resetForm();

    await loadGallery();

  } catch (error) {

    console.error(error);

    showMessage(
      "Save error: " + error.message,
      true
    );

  } finally {

    saveButton.disabled = false;

    saveButton.textContent =
      editingId
        ? "Update Gallery Item"
        : "Save Gallery Item";
  }
}

function editItem(id) {

  const item =
    galleryItems.find(
      x => String(x.id) === String(id)
    );

  if (!item) return;

  editingId = item.id;

  currentImageUrl =
    item.image_url || null;

  document.getElementById("title")
    .value = item.title || "";

  document.getElementById("description")
    .value = item.description || "";

  document.getElementById("category")
    .value = item.category_id || "";

  document.getElementById("published")
    .checked = !!item.is_published;

  document.getElementById("formTitle")
    .textContent = "Edit Gallery Item";

  document.getElementById("saveButton")
    .textContent = "Update Gallery Item";

  document.getElementById("cancelButton")
    .style.display = "inline-block";

  document.getElementById("imagePreview")
    .innerHTML =
      currentImageUrl
        ? `
          <div class="current-image">
            <strong>Current image:</strong>
            <br><br>
            <img
              src="${escapeHtml(currentImageUrl)}"
              alt="Current image"
            >
          </div>
        `
        : "";

  window.scrollTo(0, 0);
}

function resetForm() {

  editingId = null;
  currentImageUrl = null;

  document.getElementById("title")
    .value = "";

  document.getElementById("description")
    .value = "";

  document.getElementById("imageFile")
    .value = "";

  document.getElementById("category")
    .value = "";

  document.getElementById("published")
    .checked = false;

  document.getElementById("formTitle")
    .textContent = "Add Gallery Item";

  document.getElementById("saveButton")
    .textContent = "Save Gallery Item";

  document.getElementById("cancelButton")
    .style.display = "none";

  document.getElementById("imagePreview")
    .innerHTML = "";
}

async function togglePublish(id) {

  const item =
    galleryItems.find(
      x => String(x.id) === String(id)
    );

  if (!item) return;

  try {

    const {
      error
    } = await client
      .from("gallery")
      .update({
        is_published:
          !item.is_published
      })
      .eq("id", id);

    if (error) {
      throw error;
    }

    showMessage(
      item.is_published
        ? "Gallery item unpublished."
        : "Gallery item published."
    );

    await loadGallery();

  } catch (error) {

    console.error(error);

    showMessage(
      "Publish error: " + error.message,
      true
    );
  }
}

async function deleteItem(id) {

  if (
    !confirm(
      "Delete this gallery item?"
    )
  ) {
    return;
  }

  try {

    const {
      error
    } = await client
      .from("gallery")
      .delete()
      .eq("id", id);

    if (error) {
      throw error;
    }

    showMessage(
      "Gallery item deleted successfully."
    );

    await loadGallery();

  } catch (error) {

    console.error(error);

    showMessage(
      "Delete error: " + error.message,
      true
    );
  }
}

document
  .getElementById("saveButton")
  .addEventListener(
    "click",
    saveItem
  );

document
  .getElementById("cancelButton")
  .addEventListener(
    "click",
    resetForm
  );

document
  .getElementById("search")
  .addEventListener(
    "input",
    renderGallery
  );

document
  .getElementById("imageFile")
  .addEventListener(
    "change",
    function () {

      const file =
        this.files[0];

      const preview =
        document.getElementById(
          "imagePreview"
        );

      if (!file) {
        preview.innerHTML = "";
        return;
      }

      const reader =
        new FileReader();

      reader.onload =
        function (event) {

          preview.innerHTML =
            `
              <strong>Selected image:</strong>
              <br><br>
              <img
                src="${event.target.result}"
                alt="Selected image"
              >
            `;
        };

      reader.readAsDataURL(file);
    }
  );

document
  .getElementById("backButton")
  .addEventListener(
    "click",
    function () {
      location.href = "admin-dashboard.html";
    }
  );

document
  .getElementById("logoutButton")
  .addEventListener(
    "click",
    async function () {

      await client.auth.signOut();

      location.href = "admin.html";
    }
  );

start();

</script>

</body>
  </html>
