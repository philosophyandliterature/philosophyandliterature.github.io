<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://vsrhycbtqwtlrqcdyqdj.supabase.co";
const SUPABASE_KEY = "sb_publishable_K0Ha-NPagsXFw-HwHG5HbQ_d27vXgMJ";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let articles = [];
let categories = [];
let editingId = null;

function show(text, error=false) {
  const box = document.getElementById("message");
  box.textContent = text;
  box.className = "message " + (error ? "error" : "success");
}

async function start() {
  try {
    document.getElementById("articlesList").innerHTML =
      "<div class='loading'>Connecting...</div>";

    const { data: sessionData, error: sessionError } =
      await client.auth.getSession();

    if (sessionError) throw sessionError;

    if (!sessionData.session) {
      location.href = "admin.html";
      return;
    }

    await loadCategories();
    await loadArticles();

  } catch (e) {
    console.error(e);
    show("ERROR: " + (e.message || e), true);
  }
}

async function loadCategories() {
  const select = document.getElementById("category");

  select.innerHTML =
    "<option value=''>Loading categories...</option>";

  const { data, error } =
    await client
      .from("categories")
      .select("id,name")
      .order("name");

  if (error) {
    select.innerHTML =
      "<option value=''>Category error</option>";
    throw error;
  }

  categories = data || [];

  select.innerHTML =
    "<option value=''>Select category</option>";

  categories.forEach(c => {
    const option = document.createElement("option");
    option.value = c.id;
    option.textContent = c.name;
    select.appendChild(option);
  });
}

async function loadArticles() {
  const list = document.getElementById("articlesList");

  list.innerHTML =
    "<div class='loading'>Loading articles...</div>";

  const { data, error } =
    await client
      .from("articles")
      .select("*")
      .order("created_at", { ascending:false });

  if (error) throw error;

  articles = data || [];

  renderArticles();
}

function renderArticles() {
  const list = document.getElementById("articlesList");

  if (!articles.length) {
    list.innerHTML = "<p>No articles found.</p>";
    return;
  }

  const categoryMap = {};
  categories.forEach(c => {
    categoryMap[c.id] = c.name;
  });

  list.innerHTML = articles.map(a => `
    <div class="article-item">

      <div class="status ${a.is_published ? "published" : "draft"}">
        ${a.is_published ? "Published" : "Draft"}
      </div>

      <div class="article-title">
        ${escapeHtml(a.title)}
      </div>

      <div class="article-excerpt">
        ${escapeHtml(a.excerpt || "")}
      </div>

      <div class="article-meta">
        ${a.author_name ? "By " + escapeHtml(a.author_name) + " · " : ""}
        ${escapeHtml(categoryMap[a.category_id] || "No category")}
      </div>

      <div class="actions">
        <button class="edit" onclick="editArticle('${a.id}')">
          Edit
        </button>

        <button
          class="${a.is_published ? "unpublish" : "publish"}"
          onclick="togglePublish('${a.id}')">
          ${a.is_published ? "Unpublish" : "Publish"}
        </button>

        <button class="delete" onclick="deleteArticle('${a.id}')">
          Delete
        </button>
      </div>

    </div>
  `).join("");
}

function escapeHtml(value) {
  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

async function saveArticle() {

  const title = document.getElementById("title").value.trim();
  const slug = document.getElementById("slug").value.trim();
  const excerpt = document.getElementById("excerpt").value.trim();
  const content = document.getElementById("content").value.trim();
  const author = document.getElementById("authorName").value.trim();
  const category = document.getElementById("category").value || null;
  const cover = document.getElementById("coverUrl").value.trim() || null;
  const published = document.getElementById("published").checked;

  if (!title || !slug || !content) {
    show("Please fill Title, Slug and Article Content.", true);
    return;
  }

  const article = {
    title:title,
    slug:slug,
    excerpt:excerpt,
    content:content,
    author_name:author,
    category_id:category,
    cover_url:cover,
    is_published:published
  };

  try {

    let result;

    if (editingId) {
      result = await client
        .from("articles")
        .update(article)
        .eq("id", editingId);
    } else {
      result = await client
        .from("articles")
        .insert(article);
    }

    if (result.error) throw result.error;

    show(editingId
      ? "Article updated successfully."
      : "Article saved successfully.");

    resetForm();
    await loadArticles();

  } catch(e) {
    show("Save error: " + e.message, true);
  }
}

function editArticle(id) {
  const a = articles.find(x => String(x.id) === String(id));
  if (!a) return;

  editingId = a.id;

  document.getElementById("title").value = a.title || "";
  document.getElementById("slug").value = a.slug || "";
  document.getElementById("excerpt").value = a.excerpt || "";
  document.getElementById("content").value = a.content || "";
  document.getElementById("authorName").value = a.author_name || "";
  document.getElementById("category").value = a.category_id || "";
  document.getElementById("coverUrl").value = a.cover_url || "";
  document.getElementById("published").checked = !!a.is_published;

  document.getElementById("formTitle").textContent = "Edit Article";
  document.getElementById("cancelButton").style.display = "inline-block";
  document.getElementById("saveButton").textContent = "Update Article";

  window.scrollTo(0,0);
}

function resetForm() {
  editingId = null;

  ["title","slug","excerpt","content","authorName","coverUrl"]
    .forEach(id => document.getElementById(id).value = "");

  document.getElementById("category").value = "";
  document.getElementById("published").checked = false;

  document.getElementById("formTitle").textContent = "Add New Article";
  document.getElementById("cancelButton").style.display = "none";
  document.getElementById("saveButton").textContent = "Save Article";
}

async function togglePublish(id) {

  const a = articles.find(x => String(x.id) === String(id));
  if (!a) return;

  const { error } = await client
    .from("articles")
    .update({ is_published: !a.is_published })
    .eq("id", a.id);

  if (error) {
    show("Publish error: " + error.message, true);
    return;
  }

  await loadArticles();
}

async function deleteArticle(id) {

  if (!confirm("Delete this article?")) return;

  const { error } = await client
    .from("articles")
    .delete()
    .eq("id", id);

  if (error) {
    show("Delete error: " + error.message, true);
    return;
  }

  show("Article deleted successfully.");
  await loadArticles();
}

document.getElementById("saveButton")
  .addEventListener("click", saveArticle);

document.getElementById("cancelButton")
  .addEventListener("click", resetForm);

document.getElementById("search")
  .addEventListener("input", function() {

    const q = this.value.toLowerCase();

    const old = articles;

    articles = old.filter(a =>
      String(a.title || "").toLowerCase().includes(q) ||
      String(a.excerpt || "").toLowerCase().includes(q)
    );

    renderArticles();

    articles = old;
  });

document.getElementById("backButton")
  .addEventListener("click", () => {
    location.href = "admin-dashboard.html";
  });

document.getElementById("logoutButton")
  .addEventListener("click", async () => {
    await client.auth.signOut();
    location.href = "admin.html";
  });

start();
                     </script>
