<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Articles Manager | Philosophy & Literature</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px;
    }

    header h1 {
      margin: 0 0 5px;
      font-size: 22px;
    }

    header p {
      margin: 0;
      color: #d1d5db;
      font-size: 14px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 20px;
    }

    .topbar {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 15px;
      cursor: pointer;
      font-size: 14px;
    }

    .back {
      background: #374151;
      color: white;
    }

    .logout {
      background: #b91c1c;
      color: white;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
      font-size: 20px;
    }

    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 6px;
      font-weight: bold;
      font-size: 14px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 11px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
      background: white;
    }

    textarea {
      min-height: 160px;
      resize: vertical;
    }

    .help {
      color: #6b7280;
      font-size: 12px;
      margin-top: 5px;
    }

    .save {
      margin-top: 18px;
      background: #111827;
      color: white;
    }

    .cancel {
      margin-top: 18px;
      background: #e5e7eb;
      color: #111827;
      display: none;
    }

    .search {
      margin-bottom: 15px;
    }

    .article-item {
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .article-title {
      font-family: Georgia, serif;
      font-size: 21px;
      margin-bottom: 8px;
    }

    .article-excerpt {
      color: #555;
      line-height: 1.5;
      margin-bottom: 10px;
    }

    .article-meta {
      color: #6b7280;
      font-size: 13px;
      margin-bottom: 12px;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .edit {
      background: #2563eb;
      color: white;
    }

    .publish {
      background: #059669;
      color: white;
    }

    .unpublish {
      background: #d97706;
      color: white;
    }

    .delete {
      background: #dc2626;
      color: white;
    }

    .status {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 20px;
      font-size: 12px;
      margin-bottom: 8px;
    }

    .published {
      background: #dcfce7;
      color: #166534;
    }

    .draft {
      background: #fee2e2;
      color: #991b1b;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      line-height: 1.5;
      word-break: break-word;
    }

    .success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .loading {
      color: #6b7280;
      padding: 10px 0;
    }

    @media (max-width: 600px) {

      .container {
        padding: 14px;
      }

      .card {
        padding: 15px;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Manage Articles & Notes</h1>
  <p>Philosophy & Literature — Editor Panel</p>
</header>

<div class="container">

  <div class="topbar">
    <button class="back" id="backButton">
      ← Dashboard
    </button>

    <button class="logout" id="logoutButton">
      Logout
    </button>
  </div>

  <div id="message" class="message"></div>

  <!-- ARTICLE FORM -->

  <div class="card">

    <h2 id="formTitle">
      Add New Article
    </h2>

    <label for="title">
      Title *
    </label>

    <input
      id="title"
      type="text"
      placeholder="Enter article title"
    >

    <label for="slug">
      Slug *
    </label>

    <input
      id="slug"
      type="text"
      placeholder="example-article-title"
    >

    <div class="help">
      Use lowercase words separated by hyphens.
    </div>

    <label for="excerpt">
      Excerpt
    </label>

    <textarea
      id="excerpt"
      placeholder="Short description of the article"
      style="min-height:90px;"
    ></textarea>

    <label for="content">
      Article Content *
    </label>

    <textarea
      id="content"
      placeholder="Write the full article here..."
    ></textarea>

    <label for="authorName">
      Author Name
    </label>

    <input
      id="authorName"
      type="text"
      placeholder="Name shown as article author"
    >

    <label for="category">
      Category
    </label>

    <select id="category">
      <option value="">
        Select category
      </option>
    </select>

    <label for="coverUrl">
      Cover Image URL
    </label>

    <input
      id="coverUrl"
      type="url"
      placeholder="https://..."
    >

    <label>
      <input
        type="checkbox"
        id="published"
        style="width:auto;"
      >

      Publish this article
    </label>

    <button
      class="save"
      id="saveButton">
      Save Article
    </button>

    <button
      class="cancel"
      id="cancelButton">
      Cancel Edit
    </button>

  </div>


  <!-- ARTICLES LIST -->

  <div class="card">

    <h2>
      Articles & Notes
    </h2>

    <input
      class="search"
      type="text"
      id="search"
      placeholder="Search articles..."
    >

    <div id="articlesList">
      <div class="loading">
        Loading articles...
      </div>
    </div>

  </div>

</div>


<script>

/* =====================================================
   SUPABASE
   ===================================================== */

const SUPABASE_URL =
  "https://vsrhycbtqwtlrqcdyqdj.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_K0Ha-NPagsXFw-HwHG5HbQ_d27vXgMJ";

const client =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =====================================================
   STATE
   ===================================================== */

let currentUser = null;
let editingId = null;
let articles = [];
let categories = [];


/* =====================================================
   HELPERS
   ===================================================== */

function get(id) {
  return document.getElementById(id);
}


function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function showMessage(text, isError = false) {

  const box = get("message");

  box.textContent = text;

  box.className =
    "message " +
    (isError ? "error" : "success");

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}


/* =====================================================
   INITIALIZE
   ===================================================== */

async function init() {

  try {

    const {
      data: { session },
      error: sessionError
    } = await client.auth.getSession();


    if (sessionError) {

      throw sessionError;

    }


    if (!session) {

      window.location.href = "admin.html";

      return;

    }


    currentUser =
      session.user;


    const {
      data: profile,
      error: profileError
    } = await client
      .from("profiles")
      .select("full_name, role")
      .eq("id", currentUser.id)
      .single();


    if (profileError) {

      throw profileError;

    }


    if (
      !profile ||
      !["admin", "editor"].includes(profile.role)
    ) {

      showMessage(
        "You are not authorized to access this page.",
        true
      );

      return;

    }


    await loadCategories();

    await loadArticles();

  }

  catch (error) {

    console.error(error);

    showMessage(
      "Initialization error: " +
      (error.message || String(error)),
      true
    );

    get("articlesList").innerHTML =
      "<p>Could not load articles.</p>";
  }
}


/* =====================================================
   LOAD CATEGORIES
   ===================================================== */

async function loadCategories() {

  const select =
    get("category");


  select.innerHTML =
    '<option value="">Loading categories...</option>';


  const {
    data,
    error
  } = await client
    .from("categories")
    .select("id, name")
    .order("name");


  if (error) {

    select.innerHTML =
      '<option value="">Unable to load categories</option>';

    showMessage(
      "Could not load categories: " +
      error.message,
      true
    );

    return;
  }


  categories =
    data || [];


  select.innerHTML =
    '<option value="">Select category</option>';


  if (categories.length === 0) {

    select.innerHTML +=
      '<option value="">No categories found</option>';

    return;
  }


  categories.forEach(function(category) {

    const option =
      document.createElement("option");

    option.value =
      category.id;

    option.textContent =
      category.name;

    select.appendChild(option);

  });
}


/* =====================================================
   LOAD ARTICLES
   ===================================================== */

async function loadArticles() {

  get("articlesList").innerHTML =
    '<div class="loading">Loading articles...</div>';


  const {
    data,
    error
  } = await client
    .from("articles")
    .select(`
      *,
      categories (
        id,
        name
      )
    `)
    .order(
      "created_at",
      { ascending: false }
    );


  if (error) {

    get("articlesList").innerHTML =
      "<p>Could not load articles.</p>";

    showMessage(
      "Could not load articles: " +
      error.message,
      true
    );

    return;
  }


  articles =
    data || [];


  renderArticles();
}


/* =====================================================
   RENDER ARTICLES
   ===================================================== */

function renderArticles() {

  const list =
    get("articlesList");


  const search =
    get("search")
      .value
      .toLowerCase()
      .trim();


  const filtered =
    articles.filter(function(article) {

      return (

        String(article.title || "")
          .toLowerCase()
          .includes(search)

        ||

        String(article.excerpt || "")
          .toLowerCase()
          .includes(search)

        ||

        String(article.author_name || "")
          .toLowerCase()
          .includes(search)

      );

    });


  if (filtered.length === 0) {

    list.innerHTML =
      "<p>No articles found.</p>";

    return;
  }


  list.innerHTML =
    filtered.map(function(article) {

      const published =
        !!article.is_published;


      const category =
        article.categories &&
        article.categories.name
          ? article.categories.name
          : "No category";


      return `

        <div class="article-item">

          <div class="status ${
            published
              ? "published"
              : "draft"
          }">

            ${
              published
                ? "Published"
                : "Draft"
            }

          </div>


          <div class="article-title">

            ${escapeHtml(
              article.title || ""
            )}

          </div>


          <div class="article-excerpt">

            ${escapeHtml(
              article.excerpt || ""
            )}

          </div>


          <div class="article-meta">

            ${
              article.author_name
                ? "By " +
                  escapeHtml(
                    article.author_name
                  ) +
                  " · "
                : ""
            }

            ${escapeHtml(category)}

          </div>


          <div class="actions">

            <button
              class="edit"
              data-action="edit"
              data-id="${article.id}">

              Edit

            </button>


            <button
              class="${
                published
                  ? "unpublish"
                  : "publish"
              }"
              data-action="publish"
              data-id="${article.id}">

              ${
                published
                  ? "Unpublish"
                  : "Publish"
              }

            </button>


            <button
              class="delete"
              data-action="delete"
              data-id="${article.id}">

              Delete

            </button>

          </div>

        </div>

      `;

    }).join("");
}


/* =====================================================
   SAVE ARTICLE
   ===================================================== */

async function saveArticle() {

  const title =
    get("title").value.trim();

  const slug =
    get("slug").value.trim();

  const excerpt =
    get("excerpt").value.trim() || null;

  const content =
    get("content").value.trim();

  const authorName =
    get("authorName").value.trim() || null;

  const categoryId =
    get("category").value || null;

  const coverUrl =
    get("coverUrl").value.trim() || null;

  const isPublished =
    get("published").checked;


  if (!title) {

    showMessage(
      "Please enter an article title.",
      true
    );

    return;
  }


  if (!slug) {

    showMessage(
      "Please enter a slug.",
      true
    );

    return;
  }


  if (!content) {

    showMessage(
      "Please enter article content.",
      true
    );

    return;
  }


  const articleData = {

    title: title,

    slug: slug,

    excerpt: excerpt,

    content: content,

    author_name: authorName,

    category_id: categoryId,

    cover_url: coverUrl,

    is_published: isPublished

  };


  get("saveButton").disabled =
    true;


  try {

    let result;


    if (editingId) {

      result =
        await client
          .from("articles")
          .update(articleData)
          .eq("id", editingId);

    }

    else {

      result =
        await client
          .from("articles")
          .insert(articleData);

    }


    if (result.error) {

      throw result.error;

    }


    showMessage(
      editingId
        ? "Article updated successfully."
        : "Article added successfully."
    );


    resetForm();


    await loadArticles();

  }

  catch (error) {

    console.error(error);

    showMessage(
      "Could not save article: " +
      (error.message || String(error)),
      true
    );

  }

  finally {

    get("saveButton").disabled =
      false;
  }
}


/* =====================================================
   EDIT ARTICLE
   ===================================================== */

function editArticle(id) {

  const article =
    articles.find(function(item) {

      return String(item.id) ===
        String(id);

    });


  if (!article) {

    showMessage(
      "Article not found.",
      true
    );

    return;
  }


  editingId =
    String(article.id);


  get("formTitle").textContent =
    "Edit Article";


  get("title").value =
    article.title || "";


  get("slug").value =
    article.slug || "";


  get("excerpt").value =
    article.excerpt || "";


  get("content").value =
    article.content || "";


  get("authorName").value =
    article.author_name || "";


  get("category").value =
    article.category_id || "";


  get("coverUrl").value =
    article.cover_url || "";


  get("published").checked =
    !!article.is_published;


  get("cancelButton").style.display =
    "inline-block";


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}


/* =====================================================
   RESET FORM
   ===================================================== */

function resetForm() {

  editingId =
    null;


  get("formTitle").textContent =
    "Add New Article";


  get("title").value =
    "";

  get("slug").value =
    "";

  get("excerpt").value =
    "";

  get("content").value =
    "";

  get("authorName").value =
    "";

  get("category").value =
    "";

  get("coverUrl").value =
    "";

  get("published").checked =
    false;


  get("cancelButton").style.display =
    "none";
}


/* =====================================================
   PUBLISH / UNPUBLISH
   ===================================================== */

async function togglePublish(
  id,
  currentStatus
) {

  const {
    error
  } = await client
    .from("articles")
    .update({
      is_published:
        !currentStatus
    })
    .eq("id", id);


  if (error) {

    showMessage(
      "Could not change publish status: " +
      error.message,
      true
    );

    return;
  }


  showMessage(
    currentStatus
      ? "Article unpublished."
      : "Article published."
  );


  await loadArticles();
}


/* =====================================================
   DELETE ARTICLE
   ===================================================== */

async function deleteArticle(id) {

  const article =
    articles.find(function(item) {

      return String(item.id) ===
        String(id);

    });


  if (!article) return;


  const confirmed =
    confirm(
      'Delete "' +
      (article.title || "this article") +
      '"?'
    );


  if (!confirmed) return;


  const {
    error
  } = await client
    .from("articles")
    .delete()
    .eq("id", id);


  if (error) {

    showMessage(
      "Could not delete article: " +
      error.message,
      true
    );

    return;
  }


  showMessage(
    "Article deleted successfully."
  );


  if (
    editingId &&
    String(editingId) === String(id)
  ) {

    resetForm();

  }


  await loadArticles();
}


/* =====================================================
   BUTTON EVENTS
   ===================================================== */

get("saveButton")
  .addEventListener(
    "click",
    saveArticle
  );


get("cancelButton")
  .addEventListener(
    "click",
    resetForm
  );


get("search")
  .addEventListener(
    "input",
    renderArticles
  );


get("backButton")
  .addEventListener(
    "click",
    function() {

      window.location.href =
        "admin-dashboard.html";

    }
  );


get("logoutButton")
  .addEventListener(
    "click",
    async function() {

      await client.auth.signOut();

      window.location.href =
        "admin.html";

    }
  );


/* =====================================================
   ARTICLE BUTTON HANDLER
   ===================================================== */

get("articlesList")
  .addEventListener(
    "click",
    function(event) {

      const button =
        event.target.closest(
          "button[data-action]"
        );


      if (!button) return;


      const id =
        button.dataset.id;

      const action =
        button.dataset.action;


      if (action === "edit") {

        editArticle(id);

      }


      if (action === "publish") {

        const article =
          articles.find(function(item) {

            return String(item.id) ===
              String(id);

          });


        if (article) {

          togglePublish(
            id,
            !!article.is_published
          );

        }

      }


      if (action === "delete") {

        deleteArticle(id);

      }

    }
  );


/* =====================================================
   START
   =======================================
