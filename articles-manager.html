<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Manage Articles | Philosophy & Literature</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px;
    }

    header h1 {
      margin: 0 0 6px;
      font-size: 22px;
    }

    header p {
      margin: 0;
      color: #d1d5db;
      font-size: 14px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 20px;
    }

    .topbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 10px 15px;
      cursor: pointer;
      font-size: 14px;
    }

    .back {
      background: #374151;
      color: white;
    }

    .logout {
      background: #b91c1c;
      color: white;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
      font-size: 20px;
    }

    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 6px;
      font-weight: bold;
      font-size: 14px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 11px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
      background: white;
    }

    textarea {
      min-height: 160px;
      resize: vertical;
    }

    .save {
      margin-top: 18px;
      background: #111827;
      color: white;
    }

    .cancel {
      margin-top: 18px;
      background: #e5e7eb;
      color: #111827;
      display: none;
    }

    .search {
      margin-bottom: 15px;
    }

    .article-item {
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .article-title {
      font-family: Georgia, serif;
      font-size: 21px;
      margin-bottom: 8px;
    }

    .article-excerpt {
      color: #555;
      line-height: 1.5;
      margin-bottom: 10px;
    }

    .article-meta {
      color: #6b7280;
      font-size: 13px;
      margin-bottom: 12px;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .edit {
      background: #2563eb;
      color: white;
    }

    .delete {
      background: #dc2626;
      color: white;
    }

    .publish {
      background: #059669;
      color: white;
    }

    .unpublish {
      background: #d97706;
      color: white;
    }

    .status {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 20px;
      font-size: 12px;
      margin-bottom: 8px;
    }

    .published {
      background: #dcfce7;
      color: #166534;
    }

    .draft {
      background: #fee2e2;
      color: #991b1b;
    }

    .message {
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 15px;
      display: none;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .help {
      color: #6b7280;
      font-size: 12px;
      margin-top: 5px;
    }

    @media (max-width: 600px) {
      .container {
        padding: 14px;
      }

      .card {
        padding: 15px;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Manage Articles & Notes</h1>
  <p>Philosophy & Literature — Editor Panel</p>
</header>

<div class="container">

  <div class="topbar">
    <button class="back" onclick="goBack()">← Dashboard</button>
    <button class="logout" onclick="logout()">Logout</button>
  </div>

  <div id="message" class="message"></div>

  <div class="card">
    <h2 id="formTitle">Add New Article</h2>

    <label for="title">Title *</label>
    <input
      type="text"
      id="title"
      placeholder="Enter article title"
    >

    <label for="slug">Slug *</label>
    <input
      type="text"
      id="slug"
      placeholder="example-article-title"
    >
    <div class="help">
      Use lowercase words separated by hyphens.
    </div>

    <label for="excerpt">Excerpt</label>
    <textarea
      id="excerpt"
      placeholder="Short description of the article"
      style="min-height:90px;"
    ></textarea>

    <label for="content">Article Content *</label>
    <textarea
      id="content"
      placeholder="Write the full article here..."
    ></textarea>

    <label for="authorName">Author Name</label>
    <input
      type="text"
      id="authorName"
      placeholder="Name shown as article author"
    >

    <label for="category">Category</label>
    <select id="category">
      <option value="">Select category</option>
    </select>

    <label for="coverUrl">Cover Image URL</label>
    <input
      type="url"
      id="coverUrl"
      placeholder="https://..."
    >

    <label>
      <input type="checkbox" id="published" style="width:auto;">
      Publish this article
    </label>

    <button class="save" onclick="saveArticle()">
      Save Article
    </button>

    <button
      class="cancel"
      id="cancelButton"
      onclick="cancelEdit()">
      Cancel Edit
    </button>
  </div>

  <div class="card">
    <h2>Articles & Notes</h2>

    <input
      class="search"
      type="text"
      id="search"
      placeholder="Search articles..."
      oninput="renderArticles()"
    >

    <div id="articlesList">
      Loading articles...
    </div>
  </div>

</div>

<script>

  /* =====================================================
     SUPABASE CONNECTION
     ===================================================== */

  const SUPABASE_URL = "https://vsrhycbtqwtlrqcdyqdj.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_K0Ha-NPagsXFw-HwHG5HbQ_d27vXgMJ";

  const { createClient } = supabase;

  const client = createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


  let currentUser = null;
  let editingId = null;
  let articles = [];
  let categories = [];


  /* =====================================================
     INITIALIZE
     ===================================================== */

  async function init() {

    const {
      data: { session }
    } = await client.auth.getSession();

    if (!session) {
      window.location.href = "admin.html";
      return;
    }

    currentUser = session.user;

    const { data: profile, error } = await client
      .from("profiles")
      .select("full_name, role")
      .eq("id", currentUser.id)
      .single();

    if (
      error ||
      !profile ||
      !["admin", "editor"].includes(profile.role)
    ) {
      alert("You are not authorized to access this page.");

      await client.auth.signOut();

      window.location.href = "admin.html";
      return;
    }

    await loadCategories();
    await loadArticles();
  }


  /* =====================================================
     LOAD CATEGORIES
     ===================================================== */

  async function loadCategories() {

    const { data, error } = await client
      .from("categories")
      .select("id, name")
      .order("name");

    if (error) {
      showMessage(
        "Could not load categories: " + error.message,
        true
      );
      return;
    }

    categories = data || [];

    const select = document.getElementById("category");

    select.innerHTML =
      '<option value="">Select category</option>';

    categories.forEach(category => {

      const option = document.createElement("option");

      option.value = category.id;
      option.textContent = category.name;

      select.appendChild(option);
    });
  }


  /* =====================================================
     LOAD ARTICLES
     ===================================================== */

  async function loadArticles() {

    const { data, error } = await client
      .from("articles")
      .select(`
        *,
        categories(id, name)
      `)
      .order("created_at", { ascending: false });

    if (error) {
      showMessage(
        "Could not load articles: " + error.message,
        true
      );
      return;
    }

    articles = data || [];

    renderArticles();
  }


  /* =====================================================
     RENDER ARTICLES
     ===================================================== */

  function renderArticles() {

    const list =
      document.getElementById("articlesList");

    const search =
      document.getElementById("search").value
        .toLowerCase()
        .trim();

    const filtered = articles.filter(article => {

      const title =
        (article.title || "").toLowerCase();

      const excerpt =
        (article.excerpt || "").toLowerCase();

      const author =
        (article.author_name || "").toLowerCase();

      return (
        title.includes(search) ||
        excerpt.includes(search) ||
        author.includes(search)
      );
    });


    if (filtered.length === 0) {

      list.innerHTML =
        "<p>No articles found.</p>";

      return;
    }


    list.innerHTML = filtered.map(article => {

      const category =
        article.categories?.name || "No category";

      const statusClass =
        article.is_published
          ? "published"
          : "draft";

      const statusText =
        article.is_published
          ? "Published"
          : "Draft";

      const toggleClass =
        article.is_published
          ? "unpublish"
          : "publish";

      const toggleText =
        article.is_published
          ? "Unpublish"
          : "Publish";


      return `
        <div class="article-item">

          <div class="status ${statusClass}">
            ${statusText}
          </div>

          <div class="article-title">
            ${escapeHtml(article.title || "")}
          </div>

          <div class="article-excerpt">
            ${escapeHtml(article.excerpt || "")}
          </div>

          <div class="article-meta">
            ${article.author_name
              ? "By " + escapeHtml(article.author_name) + " · "
              : ""}
            ${escapeHtml(category)}
          </div>

          <div class="actions">

            <button
              class="edit"
              onclick="editArticle('${article.id}')">
              Edit
            </button>

            <button
              class="${toggleClass}"
              onclick="togglePublish('${article.id}', ${article.is_published})">
              ${toggleText}
            </button>

            <button
              class="delete"
              onclick="deleteArticle('${article.id}')">
              Delete
            </button>

          </div>

        </div>
      `;

    }).join("");
  }


  /* =====================================================
     SAVE ARTICLE
     ===================================================== */

  async function saveArticle() {

    const title =
      document.getElementById("title").value.trim();

    const slug =
      document.getElementById("slug").value.trim();

    const excerpt =
      document.getElementById("excerpt").value.trim() || null;

    const content =
      document.getElementById("content").value.trim();

    const authorName =
      document.getElementById("authorName").value.trim() || null;

    const categoryId =
      document.getElementById("category").value || null;

    const coverUrl =
      document.getElementById("coverUrl").value.trim() || null;

    const isPublished =
      document.getElementById("published").checked;


    if (!title) {
      showMessage("Please enter an article title.", true);
      return;
    }

    if (!slug) {
      showMessage("Please enter a slug.", true);
      return;
    }

    if (!content) {
      showMessage("Please enter the article content.", true);
      return;
    }


    const articleData = {
      title: title,
      slug: slug,
      excerpt: excerpt,
      content: content,
      author_name: authorName,
      category_id: categoryId,
      cover_url: coverUrl,
      is_published: isPublished
    };


    let error;


    if (editingId) {

      const result = await client
        .from("articles")
        .update(articleData)
        .eq("id", editingId);

      error = result.error;

    } else {

      const result = await client
        .from("articles")
        .insert(articleData);

      error = result.error;
    }


    if (error) {

      showMessage(
        "Error: " + error.message,
        true
      );

      return;
    }


    showMessage(
      editingId
        ? "Article updated successfully."
        : "Article added successfully."
    );


    cancelEdit();

    await loadArticles();
  }


  /* =====================================================
     EDIT ARTICLE
     ===================================================== */

  function editArticle(id) {

    const article =
      articles.find(a => a.id === id);

    if (!article) return;

    editingId = id;

    document.getElementById("formTitle").textContent =
      "Edit Article";

    document.getElementById("title").value =
      article.title || "";

    document.getElementById("slug").value =
      article.slug || "";

    document.getElementById("excerpt").value =
      article.excerpt || "";

    document.getElementById("content").value =
      article.content || "";

    document.getElementById("authorName").value =
      article.author_name || "";

    document.getElementById("category").value =
      article.category_id || "";

    document.getElementById("coverUrl").value =
      article.cover_url || "";

    document.getElementById("published").checked =
      article.is_published;


    document.getElementById("cancelButton").style.display =
      "inline-block";


    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });
