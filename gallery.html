<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gallery | Philosophy & Literature</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  :root {
    --ink: #202326;
    --ink-deep: #151719;
    --wall: #eeeae2;
    --paper: #f8f5ef;
    --paper-soft: #e4dfd5;
    --terracotta: #a85f4f;
    --terracotta-light: #c78b78;
    --sage: #657267;
    --gold: #b2945c;
    --muted: #716e68;
    --line: #d4cec3;
  }

  * {
    box-sizing: border-box;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    margin: 0;
    background: var(--wall);
    color: var(--ink);
    font-family: Arial, Helvetica, sans-serif;
  }

  /* =========================
     EXHIBITION HEADER
     ========================= */

  header {
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(
        circle at 85% 20%,
        rgba(168, 95, 79, 0.28),
        transparent 32%
      ),
      radial-gradient(
        circle at 15% 90%,
        rgba(101, 114, 103, 0.22),
        transparent 35%
      ),
      var(--ink-deep);

    color: #f8f5ef;
    padding: 78px 22px 72px;
    text-align: left;
    border-bottom: 5px solid var(--terracotta);
  }

  header::after {
    content: "";
    position: absolute;
    right: -100px;
    bottom: -150px;
    width: 360px;
    height: 360px;
    border: 1px solid rgba(248, 245, 239, 0.12);
    border-radius: 50%;
  }

  header h1 {
    position: relative;
    z-index: 1;
    max-width: 1100px;
    margin: 0 auto 14px;

    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(48px, 8vw, 88px);
    font-weight: normal;
    line-height: 0.95;
    letter-spacing: -2px;
  }

  header h1::before {
    content: "THE VISUAL ARCHIVE";
    display: block;

    margin-bottom: 18px;

    font-family: Arial, Helvetica, sans-serif;
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 3px;
    color: var(--terracotta-light);
  }

  header p {
    position: relative;
    z-index: 1;

    max-width: 1100px;
    margin: 0 auto;

    color: #c9c5bd;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 19px;
    letter-spacing: 0.3px;
  }

  /* =========================
     MAIN AREA
     ========================= */

  .container {
    max-width: 1180px;
    margin: auto;
    padding: 32px 22px 80px;
  }

  /* =========================
     BACK BUTTON
     ========================= */

  .back {
    display: inline-flex;
    align-items: center;

    margin-bottom: 38px;
    padding: 11px 17px;

    background: var(--paper);
    color: var(--ink);

    border: 1px solid var(--line);
    border-radius: 0;

    text-decoration: none;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 0.5px;

    transition:
      background 0.2s ease,
      color 0.2s ease,
      transform 0.2s ease;
  }

  .back:hover {
    background: var(--ink);
    color: var(--paper);
    transform: translateY(-2px);
  }

  /* =========================
     GALLERY GRID
     ========================= */

  .gallery {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 24px;
    align-items: start;
  }

  /* =========================
     ARTWORK CARDS
     ========================= */

  .card {
    position: relative;
    overflow: hidden;

    background: var(--paper);

    border: 1px solid var(--line);
    border-radius: 0;

    box-shadow: 0 10px 30px rgba(32, 35, 38, 0.08);

    transition:
      transform 0.25s ease,
      box-shadow 0.25s ease;
  }

  .card::before {
    content: "";
    display: block;
    height: 5px;
    background: var(--terracotta);
  }

  .card:nth-child(3n + 2)::before {
    background: var(--sage);
  }

  .card:nth-child(3n + 3)::before {
    background: var(--gold);
  }

  .card:hover {
    transform: translateY(-6px);
    box-shadow: 0 18px 38px rgba(32, 35, 38, 0.14);
  }

  /* =========================
     ARTWORK IMAGE
     ========================= */

  .card img {
    width: 100%;
    height: 310px;

    display: block;

    object-fit: cover;

    background: #ddd8cf;

    transition: transform 0.45s ease;
  }

  .card:hover img {
    transform: scale(1.025);
  }

  /* First artwork gets stronger visual weight */
  .card:first-child {
    grid-column: span 2;
  }

  .card:first-child img {
    height: 390px;
  }

  /* =========================
     CARD INFORMATION
     ========================= */

  .card-content {
    padding: 22px 22px 24px;
  }

  .card h2 {
    margin: 0 0 10px;

    font-family: Georgia, "Times New Roman", serif;
    font-size: 25px;
    font-weight: normal;
    line-height: 1.2;

    color: var(--ink);
  }

  .card:first-child h2 {
    font-size: 30px;
  }

  .description {
    margin: 0 0 16px;

    color: var(--muted);
    font-size: 15px;
    line-height: 1.7;
  }

  /* =========================
     CATEGORY LABEL
     ========================= */

  .category {
    display: inline-block;

    padding: 6px 10px;

    background: transparent;
    color: var(--terracotta);

    border: 1px solid var(--terracotta);

    border-radius: 0;

    font-size: 10px;
    font-weight: bold;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  /* =========================
     LOADING / EMPTY / ERROR
     ========================= */

  .loading,
  .empty,
  .error {
    grid-column: 1 / -1;

    background: var(--paper);

    padding: 35px 20px;

    border: 1px solid var(--line);
    border-radius: 0;

    text-align: center;

    color: var(--muted);
    font-family: Georgia, "Times New Roman", serif;
    font-size: 18px;
  }

  .error {
    color: #8b3737;
    background: #f3dfda;
    border-color: #d7aaa0;
  }

  /* =========================
     TABLET
     ========================= */

  @media (max-width: 850px) {
    header {
      padding: 65px 20px 60px;
    }

    .gallery {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .card:first-child {
      grid-column: span 2;
    }

    .card:first-child img {
      height: 350px;
    }

    .card img {
      height: 270px;
    }
  }

  /* =========================
     MOBILE
     ========================= */

  @media (max-width: 600px) {
    header {
      padding: 58px 18px 52px;
    }

    header h1 {
      font-size: 52px;
      letter-spacing: -1.5px;
    }

    header h1::before {
      font-size: 9px;
      letter-spacing: 2.5px;
    }

    header p {
      font-size: 17px;
    }

    .container {
      padding: 24px 14px 60px;
    }

    .back {
      margin-bottom: 28px;
    }

    .gallery {
      grid-template-columns: 1fr;
      gap: 20px;
    }

    .card:first-child {
      grid-column: span 1;
    }

    .card img,
    .card:first-child img {
      height: 270px;
    }

    .card-content {
      padding: 19px 18px 21px;
    }

    .card h2,
    .card:first-child h2 {
      font-size: 24px;
    }

    .description {
      font-size: 14px;
    }
  }
      </style>
</head>

<body>

<header>
  <h1>Gallery</h1>
  <p>Philosophy & Literature</p>
</header>

<div class="container">

  <a class="back" href="index.html">← Back to Home</a>

  <div id="gallery" class="gallery">
    <div class="loading">
      Loading gallery...
    </div>
  </div>

</div>

<script>

const SUPABASE_URL =
  "https://vsrhycbtqwtlrqcdyqdj.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_K0Ha-NPagsXFw-HwHG5HbQ_d27vXgMJ";

const client =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

function escapeHtml(value) {
  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

async function loadGallery() {

  const container =
    document.getElementById("gallery");

  try {

    const {
      data: items,
      error
    } = await client
      .from("gallery")
      .select("*")
      .eq("is_published", true)
      .order("created_at", {
        ascending: false
      });

    if (error) {
      throw error;
    }

    if (!items || !items.length) {

      container.innerHTML =
        "<div class='empty'>No gallery items published yet.</div>";

      return;
    }

    const categoryIds = [
      ...new Set(
        items
          .map(item => item.category_id)
          .filter(Boolean)
      )
    ];

    let categories = [];

    if (categoryIds.length) {

      const result =
        await client
          .from("categories")
          .select("id,name")
          .in("id", categoryIds);

      if (!result.error) {
        categories = result.data || [];
      }
    }

    const categoryMap = {};

    categories.forEach(category => {
      categoryMap[category.id] =
        category.name;
    });

    container.innerHTML =
      items.map(item => {

        const category =
          categoryMap[item.category_id] || "";

        return `
          <article class="card">

            ${
              item.image_url
                ? `
                  <img
                    src="${escapeHtml(item.image_url)}"
                    alt="${escapeHtml(item.title)}"
                    onerror="this.style.display='none'"
                  >
                `
                : ""
            }

            <div class="card-content">

              <h2>
                ${escapeHtml(item.title)}
              </h2>

              ${
                item.description
                  ? `
                    <div class="description">
                      ${escapeHtml(item.description)}
                    </div>
                  `
                  : ""
              }

              ${
                category
                  ? `
                    <span class="category">
                      ${escapeHtml(category)}
                    </span>
                  `
                  : ""
              }

            </div>

          </article>
        `;

      }).join("");

  } catch (error) {

    console.error(error);

    container.innerHTML =
      `
        <div class="error">
          Could not load gallery.
        </div>
      `;
  }
}

loadGallery();

</script>

</body>
</html>
