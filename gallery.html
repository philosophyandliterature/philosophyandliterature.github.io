<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gallery | Philosophy & Literature</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <style>
  :root {
    --ink: #202326;
    --ink-deep: #151719;
    --wall: #eeeae2;
    --paper: #f8f5ef;
    --paper-soft: #e4dfd5;
    --terracotta: #a85f4f;
    --terracotta-light: #c78b78;
    --sage: #657267;
    --gold: #b2945c;
    --muted: #716e68;
    --line: #d4cec3;
  }

  * {
    box-sizing: border-box;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    margin: 0;
    background: var(--wall);
    color: var(--ink);
    font-family: Arial, Helvetica, sans-serif;
  }

  /* =========================
     EXHIBITION HEADER
     ========================= */

  header {
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(
        circle at 85% 20%,
        rgba(168, 95, 79, 0.28),
        transparent 32%
      ),
      radial-gradient(
        circle at 15% 90%,
        rgba(101, 114, 103, 0.22),
        transparent 35%
      ),
      var(--ink-deep);

    color: #f8f5ef;
    padding: 78px 22px 72px;
    text-align: left;
    border-bottom: 5px solid var(--terracotta);
  }

  header::after {
    content: "";
    position: absolute;
    right: -100px;
    bottom: -150px;
    width: 360px;
    height: 360px;
    border: 1px solid rgba(248, 245, 239, 0.12);
    border-radius: 50%;
  }
    
</head>

<body>

<header>
  <h1>Gallery</h1>
  <p>Philosophy & Literature</p>
</header>

<div class="container">

  <a class="back" href="index.html">← Back to Home</a>
<div id="categoryFilters" class="category-filters"></div>
  <div id="gallery" class="gallery">
    <div class="loading">
      Loading gallery...
    </div>
  </div>

</div>

<script>

const SUPABASE_URL =
  "https://vsrhycbtqwtlrqcdyqdj.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_K0Ha-NPagsXFw-HwHG5HbQ_d27vXgMJ";

const client =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

function escapeHtml(value) {
  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}
let allGalleryItems = [];
let galleryCategoryMap = {};
let activeCategory = null;

function renderCategoryFilters(categories) {
  const filters =
    document.getElementById("categoryFilters");

  filters.innerHTML = `
    <button
      class="category-filter active"
      onclick="filterGallery(null)"
    >
      All
    </button>

    ${categories.map(category => `
      <button
        class="category-filter"
        onclick="filterGallery('${category.id}')"
      >
        ${escapeHtml(category.name)}
      </button>
    `).join("")}
  `;
}

function filterGallery(categoryId) {

  activeCategory = categoryId;

  document
    .querySelectorAll(".category-filter")
    .forEach(button => {
      button.classList.remove("active");
    });

  const activeButton =
    categoryId === null
      ? document.querySelector(".category-filter")
      : document.querySelector(
          `.category-filter[onclick="filterGallery('${categoryId}')"]`
        );

  if (activeButton) {
    activeButton.classList.add("active");
  }

  const filteredItems =
    categoryId === null
      ? allGalleryItems
      : allGalleryItems.filter(
          item => item.category_id === categoryId
        );

  renderGalleryItems(filteredItems);
} function renderGalleryItems(items) {

  const container =
    document.getElementById("gallery");

  if (!items.length) {

    container.innerHTML =
      "<div class='empty'>No visual quotes in this category yet.</div>";

    return;
  }

  container.innerHTML =
    items.map(item => {

      const category =
        galleryCategoryMap[item.category_id] || "";

      return `
        <article class="card">

          ${
            item.image_url
              ? `
                <img
                  src="${escapeHtml(item.image_url)}"
                  alt="${escapeHtml(item.title)}"
                  onerror="this.style.display='none'"
                >
              `
              : ""
          }

          <div class="card-content">

            <h2>
              ${escapeHtml(item.title)}
            </h2>

            ${
              item.description
                ? `
                  <div class="description">
                    ${escapeHtml(item.description)}
                  </div>
                `
                : ""
            }

            ${
              category
                ? `
                  <button
                    class="category"
                    onclick="filterGallery('${item.category_id}')"
                  >
                    ${escapeHtml(category)}
                  </button>
                `
                : ""
            }

          </div>

        </article>
      `;

    }).join("");
}
async function loadGallery() {

  const container =
    document.getElementById("gallery");

  try {

    const {
      data: items,
      error
    } = await client
      .from("gallery")
      .select("*")
      .eq("is_published", true)
      .order("created_at", {
        ascending: false
      });

    if (error) {
      throw error;
    }

    if (!items || !items.length) {

      container.innerHTML =
        "<div class='empty'>No gallery items published yet.</div>";

      return;
    }

    allGalleryItems = items;

    const categoryIds = [
      ...new Set(
        items
          .map(item => item.category_id)
          .filter(Boolean)
      )
    ];

    let categories = [];

    if (categoryIds.length) {

      const result =
        await client
          .from("categories")
          .select("id,name")
          .in("id", categoryIds);

      if (!result.error) {
        categories = result.data || [];
      }
    }

    galleryCategoryMap = {};

    categories.forEach(category => {
      galleryCategoryMap[category.id] =
        category.name;
    });

    renderCategoryFilters(categories);

    renderGalleryItems(items);

  } catch (error) {

    console.error(error);

    container.innerHTML =
      `
        <div class="error">
          Could not load gallery.
        </div>
      `;
  
  }
}

loadGallery();

</script>

</body>
</html>
