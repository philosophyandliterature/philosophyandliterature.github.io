    }

    .hero h2 {
      font-size: 38px;
      margin: 12px 0 18px;
    }

    .hero p {

      font-size: 18px;
      color: #514b43;
    }

    .divider {

      max-width: 1100px;
      margin: 0 auto 80px;
      padding: 0 20px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
    }

    .card {
      background: #fffdf8;
      border: 1px solid #e1dbcf;
      padding: 28px;
      border-radius: 6px;
      box-shadow: 0 4px 14px rgba(50,40,25,0.07);
    }

    .number {
      color: #9a8050;
      font-size: 13px;
      letter-spacing: 1px;
    }

    .card h3 {
      margin: 7px 0 10px;
      font-size: 22px;
    }

    .card p {
      color: #5c554d;
    }

    .card a {
      color: #6b4f2a;
      text-decoration: none;
      font-weight: bold;
    }

    .quote-section {
      background: #ebe4d7;
      padding: 70px 20px;
      text-align: center;
    }

    blockquote {
      max-width: 750px;
      margin: auto;
      font-size: 24px;
      font-style: italic;
    }

    .quote-note {
      margin-top: 18px;
      color: #6b6257;
    }

    .about {
      max-width: 800px;
      margin: auto;
      padding: 75px 20px;
      text-align: center;
    }

    .about h2 {
      font-size: 30px;
    }

    .about p {
      color: #514b43;
      font-size: 17px;
    }

    footer {
      background: #29251f;
      color: #d8d2c7;
      text-align: center;
      padding: 30px 20px;
    }
